[workspace]
resolver = "2"
members = [
    "nanite-blob",
    "nanite-bake-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/jriegel/Vulcanite"

[workspace.dependencies]
nanite-blob = { path = "nanite-blob" }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
glam = "0.29"
gltf = { version = "1", features = ["extras"] }
indicatif = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = true
